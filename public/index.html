<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>DevOps Midterm App</title>
  <style>    

  :root { --bg:#0f172a; --card:#1e293b; --text:#e2e8f0; --muted:#94a3b8; --ok:#22c55e; --bad:#ef4444; }
    * { box-sizing: border-box; }
    body { margin:0; min-height:100vh; display:flex; align-items:center; justify-content:center;
           background:var(--bg); color:var(--text); font-family:system-ui,-apple-system,Segoe UI,sans-serif; padding:16px; }
    main { width:100%; max-width:560px; background:var(--card); border-radius:16px; padding:28px; box-shadow:0 10px 30px rgba(0,0,0,.35); }
    h1 { margin:0 0 4px; font-size:1.4rem; }
    p.sub { margin:0 0 20px; color:var(--muted); font-size:.9rem; }
    .status { display:flex; align-items:center; gap:10px; font-size:1.1rem; font-weight:600; margin-bottom:20px; }
    .dot { width:14px; height:14px; border-radius:50%; background:var(--muted); }
    .dot.ok { background:var(--ok); box-shadow:0 0 10px var(--ok); }
    .dot.bad { background:var(--bad); box-shadow:0 0 10px var(--bad); }
    dl { display:grid; grid-template-columns:auto 1fr; gap:8px 16px; margin:0; font-size:.92rem; }
    dt { color:var(--muted); }
    dd { margin:0; text-align:right; word-break:break-all; }
    footer { margin-top:20px; color:var(--muted); font-size:.8rem; display:flex; justify-content:space-between; }
    a { color:#38bdf8; }
    
    </style>
</head>
<body>
  <main>
    <h1>TSU DevOps Midterm App</h1>

    <div class="status"><span id="dot" class="dot"></span><span id="status">Checking...</span></div>

    <dl id="details"></dl>

    <footer>
      <span id="updated">&nbsp;</span>
      <a href="/health">/health (JSON)</a>
    </footer>
  </main>

  <script>
    const fields = [
      ['Service', 'service'],
      ['Commit', 'commit'], 
      ['Region', 'region'], 
      ['Node', 'node'], 
      ['Uptime', 'uptime']
    ];

    async function refresh() {
      const dot = document.getElementById('dot');
      const status = document.getElementById('status');
      const details = document.getElementById('details');
      try {
        const res = await fetch('/health', { cache: 'no-store' });
        if (!res.ok) throw new Error('HTTP ' + res.status);
        const d = await res.json();
        dot.className = 'dot ok';
        status.textContent = 'All systems operational';
        const rows = fields.map(([label, key]) => [label, d[key]]);
        rows.push(['Memory (RSS)', d.memory.rssMB + ' MB']);
        details.innerHTML = rows
          .map(([k, v]) => '<dt>' + k + '</dt><dd>' + String(v).replace(/</g, '&lt;') + '</dd>')
          .join('');
      } catch (e) {
        dot.className = 'dot bad';
        status.textContent = 'Service unavailable';
      }
      document.getElementById('updated').textContent = 'Updated ' + new Date().toLocaleTimeString();
    }

    refresh();
    setInterval(refresh, 10000);
  </script>
</body>
</html>
